# Mounted over /etc/nginx/conf.d in round 2 of the compatibility test.
#
# Exercises the paths a real user depends on: that conf.d is included at all,
# that the docroot is /usr/share/nginx/html, and that gzip, add_header,
# return, error_page, body limits and stub_status all behave the same.
server {
    listen       80 default_server;
    server_name  localhost;
    root         /usr/share/nginx/html;

    add_header X-Echo-Test compat;

    gzip             on;
    gzip_types       text/plain;
    gzip_min_length  256;
    gzip_comp_level  5;

    client_max_body_size 256k;

    location / {
        index index.html;
    }

    location /echo {
        return 200 "echo-ok\n";
    }

    location /basic_status {
        stub_status;
    }

    error_page 404 = @notfound;
    location @notfound {
        return 404 "custom-404\n";
    }
}
